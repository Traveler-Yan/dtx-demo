spring:
  application:
    name: dtx-tcc
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:h2:mem:dtx_tcc;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8

logging:
  level:
    root: WARN
    com.example.dtx: INFO
